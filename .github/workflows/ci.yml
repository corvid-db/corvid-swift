# ci — the Swift-consumer gate.
#
# The golden-suite port runs on macOS against the PINNED xcframework
# (SwiftPM resolves the binary target by URL + checksum from Package.swift
# — the pin IS the manifest). The iOS-simulator leg compiles the package
# against the simulator slice (links the staticlib for arm64-sim), so a
# slice-level defect fails here, not in an app.
#
# Toolchain policy (docs/PLAN.md): Xcode on the macos runner (Swift 6
# toolchain, Swift 5 language mode); no pinned toolchain — the binding
# targets the platform C ABI and stdlib basics only.
name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (macos, golden suite)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift test
        run: swift test

  ios-sim:
    name: iOS Simulator compile
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build against the iOS Simulator slice
        run: |
          set -euo pipefail
          DEST='generic/platform=iOS Simulator'
          xcodebuild -scheme Corvid -destination "$DEST" build 2>&1 | tail -5

  surface-gate:
    # docs/SURFACE.tsv vs the engine's surface list at the PINNED tag:
    # every engine construct mapped (binding api + proving test) or N/A
    # with a reason; N/A count pinned to the committed baseline.
    name: surface gate (SURFACE.tsv vs pinned engine)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Resolve docs/SURFACE.tsv against the pinned engine surface
        run: ./scripts/surface-gate.sh
